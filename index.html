<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary meta (rewritten per route at the edge by functions/_middleware.js) -->
    <title>Pizzeria El Chocolate | Authentic Cuban Pizza in North Fort Myers, FL</title>
    <meta name="description" content="Authentic Cuban pizza in North Fort Myers, FL: thick sweet crust, golden edge-to-edge cheese, lobster and alligator pies, croquetas, tropical shakes and chocolate pizza." />
    <meta name="theme-color" content="#1e0f0a" />
    <meta name="color-scheme" content="dark light" />
    <link rel="canonical" href="https://elchocolatepizza.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pizzeria El Chocolate" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_US" />
    <meta property="og:title" content="Pizzeria El Chocolate | Authentic Cuban Pizza in North Fort Myers, FL" />
    <meta property="og:description" content="Cuban pizza, croquetas, tropical shakes and chocolate pizza on Pondella Rd, North Fort Myers." />
    <meta property="og:image" content="https://elchocolatepizza.com/images/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pizzeria El Chocolate: authentic Cuban pizza" />
    <meta property="og:url" content="https://elchocolatepizza.com/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pizzeria El Chocolate | Authentic Cuban Pizza in North Fort Myers, FL" />
    <meta name="twitter:description" content="Cuban pizza, croquetas, tropical shakes and chocolate pizza on Pondella Rd, North Fort Myers." />
    <meta name="twitter:image" content="https://elchocolatepizza.com/images/og.png" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Theme before paint (no flash): stored choice, else system preference -->
    <script>
      try {
        var t = localStorage.getItem('pec-theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
        var l = localStorage.getItem('pec-lang');
        if (l === 'es') document.documentElement.lang = 'es';
      } catch (e) {}
    </script>

    <!-- Fonts load async so a slow fonts.googleapis.com never blocks first render -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Archivo:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Archivo:wght@400;500;600;700&display=swap" />
    </noscript>

    <!-- Schema.org: Restaurant + WebSite (page-level schema is injected by <SEO/>) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Restaurant",
          "@id": "https://elchocolatepizza.com/#restaurant",
          "name": "Pizzeria El Chocolate",
          "url": "https://elchocolatepizza.com",
          "image": "https://elchocolatepizza.com/images/og.png",
          "logo": "https://elchocolatepizza.com/favicon.svg",
          "telephone": "+1-239-946-9006",
          "servesCuisine": ["Cuban", "Pizza"],
          "priceRange": "$",
          "acceptsReservations": "False",
          "hasMenu": "https://elchocolatepizza.com/menu",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "899 Pondella Rd",
            "addressLocality": "North Fort Myers",
            "addressRegion": "FL",
            "postalCode": "33903",
            "addressCountry": "US"
          },
          "openingHoursSpecification": [{
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],
            "opens": "11:00",
            "closes": "21:00"
          }],
          "availableLanguage": ["English", "Spanish"],
          "sameAs": ["https://www.instagram.com/pizzeriaelchocolate/"]
        },
        {
          "@type": "WebSite",
          "@id": "https://elchocolatepizza.com/#website",
          "url": "https://elchocolatepizza.com",
          "name": "Pizzeria El Chocolate",
          "inLanguage": ["en", "es"],
          "publisher": { "@id": "https://elchocolatepizza.com/#restaurant" }
        }
      ]
    }
    </script>

    <!-- Plausible Analytics: privacy-first, no cookies. The stub queues
         events fired before the script loads (see src/lib/analytics.ts). -->
    <script>window.plausible=window.plausible||function(){(window.plausible.q=window.plausible.q||[]).push(arguments)}</script>
    <script defer data-domain="elchocolatepizza.com" src="https://plausible.io/js/script.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
